name = "a1score-push-cron"
main = "index.ts"
compatibility_date = "2024-09-23"

[triggers]
# Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
crons = ["0 */6 * * *"]

[vars]
SITE_URL = "https://a1score.app"

# Note: CRON_SECRET must be configured as a secret via:
# npx wrangler secret put CRON_SECRET
