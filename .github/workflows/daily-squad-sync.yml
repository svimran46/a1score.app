name: Squad Reconciliation & Integrity Check

on:
  schedule:
    # 1. Daily at 02:00 UTC for full 7 leagues reconciliation (Part B Rule 6)
    - cron: '0 2 * * *'
    # 2. Hourly for top clubs during active transfer windows (Jan, Jun, Jul, Aug)
    - cron: '0 * * 1,6,7,8 *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      mode:
        description: 'Reconciliation Scope'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - top-clubs

jobs:
  squad-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Canonical Squad Reconciliation
        run: |
          CURRENT_HOUR=$(date -u +'%H')
          if [ "${{ github.event.inputs.mode }}" = "top-clubs" ] || ([ "$CURRENT_HOUR" != "02" ] && [ "${{ github.event_name }}" = "schedule" ]); then
            echo "Running hourly transfer-window sync for top clubs..."
            npx tsx scripts/reconcile-squads-canonical.ts --top-clubs --apply
          else
            echo "Running daily comprehensive 7-leagues squad reconciliation..."
            npx tsx scripts/reconcile-squads-canonical.ts --apply
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Data Integrity Suite
        run: npx tsx scripts/verify-data-integrity.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  test-integrity:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Read-Only Test Suite
        run: npm test
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

