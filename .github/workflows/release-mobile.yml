name: Build & Release Mobile App (Android APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "Release Notes / Changelog"
        required: false
        default: "New standalone mobile release for a1score."
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Android APKs
        run: |
          set -e
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease -x test 2>&1 | tee gradle-build.log

      - name: Prepare and Sign Release APKs
        run: |
          (
            echo "=== 1. Locating Built APKs ==="
            find android/app/build/outputs/apk -type f -name "*.apk"

            RELEASE_SOURCE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
            DEBUG_SOURCE=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
            SIGNED_APK="a1score-v${VERSION}.apk"
            DEBUG_APK="a1score-debug-v${VERSION}.apk"

            echo "Release source APK: $RELEASE_SOURCE"
            echo "Debug source APK: $DEBUG_SOURCE"

            if [ -z "$RELEASE_SOURCE" ]; then
              echo "⚠️ Warning: No release APK found, using debug APK as release candidate..."
              RELEASE_SOURCE="$DEBUG_SOURCE"
            fi

            if [ -z "$RELEASE_SOURCE" ]; then
              echo "❌ Error: No APK found anywhere in android/app/build/outputs/apk"
              exit 1
            fi

            if [ -n "$DEBUG_SOURCE" ]; then
              cp "${DEBUG_SOURCE}" "${DEBUG_APK}"
              echo "Copied debug APK to ${DEBUG_APK}"
            fi

            echo "=== 2. Locating Signing Tools & Keystores ==="
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
            echo "Using apksigner at: $APKSIGNER"

            DEBUG_KEYSTORE=$(find $HOME -name "debug.keystore" 2>/dev/null | head -n 1)
            echo "Found debug keystore at: $DEBUG_KEYSTORE"

            echo "=== 3. Signing Release APK ==="
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "Signing with repository secret keystore..."
              echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
              "$APKSIGNER" sign --ks release.keystore \
                --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
                --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
                --out "${SIGNED_APK}" "${RELEASE_SOURCE}"
            elif [ -n "$DEBUG_KEYSTORE" ] && [ -f "$DEBUG_KEYSTORE" ]; then
              echo "Signing release APK with debug keystore ($DEBUG_KEYSTORE)..."
              "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" \
                --ks-pass "pass:android" \
                --key-pass "pass:android" \
                --ks-key-alias "androiddebugkey" \
                --out "${SIGNED_APK}" "${RELEASE_SOURCE}"
            else
              echo "Keystore not found, copying release source directly..."
              cp "${RELEASE_SOURCE}" "${SIGNED_APK}"
            fi

            echo "=== 4. Verifying APK Signatures ==="
            if [ -n "$APKSIGNER" ]; then
              echo "Verifying ${SIGNED_APK}:"
              "$APKSIGNER" verify --verbose "${SIGNED_APK}" || true
              if [ -f "${DEBUG_APK}" ]; then
                echo "Verifying ${DEBUG_APK}:"
                "$APKSIGNER" verify --verbose "${DEBUG_APK}" || true
              fi
            fi

            echo "=== 5. Final APK Artifacts ==="
            ls -lh a1score*.apk
          ) 2>&1 | tee /tmp/signing_output.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "## 📱 Mobile Build & Signing Summary (Exit: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat /tmp/signing_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Signing step failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Upload Diagnostics Always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-diagnostics
          path: |
            android/gradle-build.log
            /tmp/signing_output.log

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: a1score-android-apks
          path: a1score*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "a1score Mobile v${{ env.VERSION }}"
          body: |
            ## 📱 a1score Mobile Standalone Release v${{ env.VERSION }}

            ${{ github.event.inputs.release_notes || 'Automated mobile release for Android devices.' }}

            ### 📦 Download & Install:
            - **`a1score-v${{ env.VERSION }}.apk`**: Standalone signed APK for direct installation on Android devices and third-party app distribution.
            - **`a1score-debug-v${{ env.VERSION }}.apk`**: Debug build for testing and sideloading.

            ### ✨ Key Features:
            - Full-screen native experience with FotMob-style bottom navigation.
            - Real-time matches, live market valuation updates, TV schedules, and Transfer Centre.
            - Over-the-air updates directly synced with Cloudflare Edge.
          files: |
            a1score-v*.apk
            a1score-debug-v*.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
