name: Build & Release Mobile App (Android APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "Release Notes / Changelog"
        required: false
        default: "New standalone mobile release for a1score."
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK Components
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Android APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace -x lint -x lintVitalRelease -x test 2>&1 | tee gradle-build.log || {
            echo "## ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Build Log Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log

      - name: Prepare and Verify Release APKs
        run: |
          set -e
          echo "=== Locating Built APKs ==="
          find android/app/build/outputs/apk -type f -name "*.apk"

          RELEASE_SOURCE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_SOURCE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          SIGNED_APK="a1score-v${VERSION}.apk"
          DEBUG_APK="a1score-debug-v${VERSION}.apk"

          echo "Found release source: $RELEASE_SOURCE"
          echo "Found debug source: $DEBUG_SOURCE"

          if [ -z "$RELEASE_SOURCE" ]; then
            echo "❌ Error: No release APK found in android/app/build/outputs/apk/release"
            exit 1
          fi

          if [ -n "$DEBUG_SOURCE" ]; then
            cp "${DEBUG_SOURCE}" "${DEBUG_APK}"
            echo "Copied debug APK to ${DEBUG_APK}"
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            "$APKSIGNER" sign --ks release.keystore \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --out "${SIGNED_APK}" "${RELEASE_SOURCE}"
          else
            echo "Using Gradle-signed release APK..."
            cp "${RELEASE_SOURCE}" "${SIGNED_APK}"
          fi

          echo "=== Verifying APK Signatures ==="
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying ${SIGNED_APK}:"
            "$APKSIGNER" verify --verbose "${SIGNED_APK}"
            if [ -f "${DEBUG_APK}" ]; then
              echo "Verifying ${DEBUG_APK}:"
              "$APKSIGNER" verify --verbose "${DEBUG_APK}"
            fi
          fi

          echo "=== Final APK Artifacts ==="
          ls -lh a1score*.apk

          echo "## 📱 Mobile Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | File Name | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Release APK | \`${SIGNED_APK}\` | $(du -h "${SIGNED_APK}" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          if [ -f "${DEBUG_APK}" ]; then
            echo "| Debug APK | \`${DEBUG_APK}\` | $(du -h "${DEBUG_APK}" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: a1score-android-apks
          path: a1score*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "a1score Mobile v${{ env.VERSION }}"
          body: |
            ## 📱 a1score Mobile Standalone Release v${{ env.VERSION }}

            ${{ github.event.inputs.release_notes || 'Automated mobile release for Android devices.' }}

            ### 📦 Download & Install:
            - **`a1score-v${{ env.VERSION }}.apk`**: Standalone signed APK for direct installation on Android devices and third-party app distribution.
            - **`a1score-debug-v${{ env.VERSION }}.apk`**: Debug build for testing and sideloading.

            ### ✨ Key Features:
            - Full-screen native experience with FotMob-style bottom navigation.
            - Real-time matches, live market valuation updates, TV schedules, and Transfer Centre.
            - Over-the-air updates directly synced with Cloudflare Edge.
          files: |
            a1score-v*.apk
            a1score-debug-v*.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
